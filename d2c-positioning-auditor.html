<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Positioning Audit — Field Instrument</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDE9E0;
    --paper-raised:#F6F3EC;
    --ink:#1C1B19;
    --ink-soft:#5B564C;
    --accent:#A8632B;
    --accent-soft:#C98A52;
    --sage:#5F7259;
    --brick:#8B3A3A;
    --mixed:#A8791F;
    --line:#CFC7B6;
    --serif:'Fraunces', serif;
    --sans:'Inter', sans-serif;
    --mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    line-height:1.5;
  }
  .wrap{
    max-width:880px;
    margin:0 auto;
    padding:56px 28px 90px;
  }
  .eyebrow{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--accent);
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:14px;
  }
  .eyebrow::before{
    content:'';
    width:22px;
    height:1px;
    background:var(--accent);
  }
  h1{
    font-family:var(--serif);
    font-weight:600;
    font-size:44px;
    line-height:1.05;
    margin:0 0 8px;
    letter-spacing:-0.01em;
  }
  .sub{
    font-size:15px;
    color:var(--ink-soft);
    max-width:56ch;
    margin:0 0 40px;
  }

  .intake{
    background:var(--paper-raised);
    border:1px solid var(--line);
    padding:28px;
    position:relative;
  }
  .intake::before{
    content:'CASE INTAKE';
    position:absolute;
    top:-10px;
    left:24px;
    background:var(--paper);
    padding:0 8px;
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:0.14em;
    color:var(--ink-soft);
  }
  label{
    display:block;
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin:20px 0 8px;
  }
  label:first-of-type{margin-top:4px;}
  label .opt{
    text-transform:none;
    letter-spacing:0;
    color:var(--accent-soft);
    font-family:var(--sans);
  }
  input[type=text], textarea{
    width:100%;
    background:#fff;
    border:1px solid var(--line);
    color:var(--ink);
    font-family:var(--sans);
    font-size:14.5px;
    padding:12px 14px;
    resize:vertical;
  }
  input[type=text]{height:44px;}
  textarea{min-height:88px;}
  input:focus, textarea:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }

  .fetch-row{
    display:flex;
    gap:10px;
  }
  .fetch-row input{flex:1;}
  button.fetch{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    background:var(--paper);
    color:var(--ink);
    border:1px solid var(--ink);
    padding:0 18px;
    cursor:pointer;
    white-space:nowrap;
  }
  button.fetch:hover:not(:disabled){background:var(--ink); color:var(--paper);}
  button.fetch:disabled{opacity:0.5; cursor:wait;}
  .fetch-status{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-soft);
    margin-top:6px;
    min-height:14px;
  }
    display:flex;
    align-items:center;
    gap:16px;
    margin-top:26px;
  }
  button.run{
    font-family:var(--mono);
    font-size:12px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    background:var(--ink);
    color:var(--paper);
    border:none;
    padding:14px 24px;
    cursor:pointer;
    transition:background .15s ease;
  }
  button.run:hover:not(:disabled){background:var(--accent);}
  button.run:disabled{opacity:0.5; cursor:wait;}
  .status{
    font-family:var(--mono);
    font-size:12px;
    color:var(--ink-soft);
  }
  .error{
    font-family:var(--mono);
    font-size:12px;
    color:var(--brick);
    margin-top:14px;
  }

  #report{margin-top:52px;}
  .report-head{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    border-bottom:1px solid var(--ink);
    padding-bottom:10px;
    margin-bottom:14px;
  }
  .report-head h2{
    font-family:var(--serif);
    font-size:26px;
    font-weight:600;
    margin:0;
  }
  .report-head .date{
    font-family:var(--mono);
    font-size:11px;
    color:var(--ink-soft);
  }
  .overall-read{
    font-family:var(--serif);
    font-style:italic;
    font-size:21px;
    color:var(--accent);
    margin:0 0 26px;
    padding-bottom:20px;
    border-bottom:1px dashed var(--line);
  }
  .copy-row{
    display:flex;
    justify-content:flex-end;
    margin-top:14px;
  }
  button.copy{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    background:transparent;
    color:var(--ink-soft);
    border:1px solid var(--line);
    padding:9px 16px;
    cursor:pointer;
  }
  button.copy:hover{border-color:var(--accent); color:var(--accent);}

  .card{
    position:relative;
    background:var(--paper-raised);
    border:1px solid var(--line);
    padding:22px 24px;
    margin-bottom:18px;
    overflow:hidden;
  }
  .card-title{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--ink-soft);
    margin-bottom:10px;
  }
  .diagnosis{
    font-family:var(--serif);
    font-style:italic;
    font-weight:500;
    font-size:19px;
    margin:0 0 10px;
    max-width:80%;
  }
  .analysis{
    font-size:14.5px;
    color:var(--ink-soft);
    max-width:80%;
    margin:0;
  }
  .stamp{
    position:absolute;
    top:18px;
    right:22px;
    transform:rotate(-8deg);
    font-family:var(--mono);
    font-weight:500;
    font-size:12px;
    letter-spacing:0.12em;
    padding:5px 12px;
    border:2px solid currentColor;
    border-radius:3px;
    text-transform:uppercase;
  }
  .stamp.strong{color:var(--sage);}
  .stamp.mixed{color:var(--mixed);}
  .stamp.weak{color:var(--brick);}

  .bottom-line{
    background:var(--ink);
    color:var(--paper);
    padding:30px 28px;
    margin-top:30px;
    position:relative;
  }
  .bottom-line::before{
    content:'BOTTOM LINE';
    position:absolute;
    top:-10px;
    left:24px;
    background:var(--paper);
    color:var(--ink);
    padding:0 8px;
    font-family:var(--mono);
    font-size:10px;
    letter-spacing:0.14em;
  }
  .bottom-line p{
    font-family:var(--serif);
    font-size:19px;
    line-height:1.5;
    margin:6px 0 0;
  }
  .signoff{
    margin-top:18px;
    font-family:var(--mono);
    font-size:11px;
    color:var(--accent-soft);
    letter-spacing:0.05em;
  }

  @media (max-width:600px){
    h1{font-size:32px;}
    .diagnosis, .analysis{max-width:100%;}
    .stamp{position:static; display:inline-block; transform:rotate(-4deg); margin-bottom:10px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="eyebrow">Field Instrument · 01</div>
  <h1>Positioning Audit</h1>
  <p class="sub">Paste in what a brand says about itself and what its customers actually say back. The audit tells you where the two agree — and where the story breaks.</p>

  <div class="intake">
    <label>Brand name</label>
    <input type="text" id="brandName" placeholder="e.g. Sweet Karam Coffee">

    <label>Website URL <span class="opt">— paste the link, then fetch, or skip straight to pasting copy below</span></label>
    <div class="fetch-row">
      <input type="text" id="websiteUrl" placeholder="https://brandname.com">
      <button class="fetch" id="fetchBtn" onclick="fetchWebsite()">Fetch</button>
    </div>
    <div class="fetch-status" id="fetchStatus"></div>

    <label>Website copy — homepage / about page</label>
    <textarea id="websiteCopy" placeholder="Paste the brand's own words: homepage headline, about section, product descriptions... (or use Fetch above)"></textarea>

    <label>Instagram — bio + a handful of recent captions</label>
    <textarea id="instaCopy" placeholder="Paste the bio line and 3–5 recent captions..."></textarea>

    <label>Customer reviews <span class="opt">— optional, but sharpens the audit considerably</span></label>
    <textarea id="reviews" placeholder="Paste 5–10 real customer reviews if you have them..."></textarea>

    <label>Nearest competitor <span class="opt">— optional, sharpens the differentiation read</span></label>
    <input type="text" id="competitor" placeholder="e.g. a direct rival brand in the same category">

    <div class="run-row">
      <button class="run" id="runBtn" onclick="runAudit()">Run Audit</button>
      <span class="status" id="statusText"></span>
    </div>
    <div class="error" id="errorText"></div>
  </div>

  <div id="report"></div>

</div>

<script>
async function fetchWebsite(){
  const url = document.getElementById('websiteUrl').value.trim();
  const fetchBtn = document.getElementById('fetchBtn');
  const fetchStatus = document.getElementById('fetchStatus');
  const websiteCopy = document.getElementById('websiteCopy');

  if(!url){
    fetchStatus.textContent = 'Enter a URL first.';
    return;
  }

  let targetUrl = url;
  if(!/^https?:\/\//i.test(targetUrl)){
    targetUrl = 'https://' + targetUrl;
  }

  fetchBtn.disabled = true;
  fetchStatus.textContent = 'Fetching page...';

  try{
    const proxied = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(targetUrl);
    const res = await fetch(proxied);
    if(!res.ok){ throw new Error('status ' + res.status); }
    const html = await res.text();

    const parser = new DOMParser();
    const doc = parser.parseFromString(html, 'text/html');
    doc.querySelectorAll('script, style, noscript, svg, nav, footer').forEach(el => el.remove());

    let text = doc.body ? doc.body.innerText : '';
    text = text.replace(/\n{2,}/g, '\n').replace(/[ \t]{2,}/g, ' ').trim();
    text = text.slice(0, 4000);

    if(!text || text.length < 40){
      throw new Error('empty');
    }

    websiteCopy.value = text;
    fetchStatus.textContent = 'Fetched ' + text.length + ' characters. Trim it down to the parts that actually matter before running the audit.';
  }catch(err){
    console.error(err);
    fetchStatus.textContent = 'Could not fetch that page automatically (some sites block it). Paste the copy in manually below instead.';
  }finally{
    fetchBtn.disabled = false;
  }
}

async function runAudit(){
  const brand = document.getElementById('brandName').value.trim();
  const website = document.getElementById('websiteCopy').value.trim();
  const insta = document.getElementById('instaCopy').value.trim();
  const reviews = document.getElementById('reviews').value.trim();
  const competitor = document.getElementById('competitor').value.trim();
  const btn = document.getElementById('runBtn');
  const status = document.getElementById('statusText');
  const errorBox = document.getElementById('errorText');
  const report = document.getElementById('report');

  errorBox.textContent = '';

  if(!brand || !website){
    errorBox.textContent = 'Enter a brand name and at least the website copy before running the audit.';
    return;
  }

  btn.disabled = true;
  status.textContent = 'Reading the file...';
  report.innerHTML = '';

  const systemPrompt = `You are a sharp, unsentimental brand strategist auditing a D2C brand's positioning. You write in a prescriptive, operator register — like a strategy memo, not a marketing puff piece.

GROUNDING RULE (most important): every "analysis" field must reference something specific and concrete from the material you were given — a phrase, a claim, a specific product name, a specific line from a review. Never write generic statements that could apply to any D2C brand ("the brand should focus on storytelling", "consider your target audience more clearly"). If the material is too thin to say something specific, say plainly that it's thin rather than inventing generic filler.

Respond with ONLY valid JSON, no markdown fences, no preamble, in exactly this shape:

{
  "overallRead":"under 16 words. One sharp headline verdict on this brand's positioning as a whole — e.g. the single biggest gap or the single clearest strength.",
  "categories": [
    {"key":"origin","title":"Founder Story & Origin Clarity","verdict":"STRONG|MIXED|WEAK","diagnosis":"under 12 words, sharp","analysis":"under 45 words, grounded in specifics from the input"},
    {"key":"audience","title":"Target Customer Specificity","verdict":"STRONG|MIXED|WEAK","diagnosis":"under 12 words","analysis":"under 45 words, grounded in specifics"},
    {"key":"differentiation","title":"Differentiation Clarity","verdict":"STRONG|MIXED|WEAK","diagnosis":"under 12 words","analysis":"under 45 words. If a competitor was named, contrast directly against it; otherwise judge against the stated category norm."},
    {"key":"pricevalue","title":"Price-Value Positioning","verdict":"STRONG|MIXED|WEAK","diagnosis":"under 12 words","analysis":"under 45 words on whether the price story (if mentioned) matches the value story being told. If pricing isn't mentioned anywhere, say so and mark MIXED."},
    {"key":"consistency","title":"Cross-Channel Consistency","verdict":"STRONG|MIXED|WEAK","diagnosis":"under 12 words","analysis":"under 45 words comparing the actual tone/voice of the website text vs the Instagram text"},
    {"key":"voicegap","title":"Customer Voice Gap","verdict":"STRONG|MIXED|WEAK","diagnosis":"under 12 words","analysis":"under 45 words. If no reviews were provided, say so plainly and mark verdict MIXED."}
  ],
  "bottomLine":"under 80 words. One clear prescriptive recommendation — what this brand should do next, stated as a decision, not a suggestion."
}`;

  const userContent = `BRAND: ${brand}

WEBSITE COPY:
${website || '(not provided)'}

INSTAGRAM:
${insta || '(not provided)'}

CUSTOMER REVIEWS:
${reviews || '(not provided)'}

NEAREST COMPETITOR:
${competitor || '(not provided)'}`;

  try{
    status.textContent = 'Cross-referencing the story against the evidence...';

    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        system: systemPrompt,
        messages: [{ role: "user", content: userContent }]
      })
    });

    if(!response.ok){
      throw new Error('API returned status ' + response.status);
    }

    const data = await response.json();
    const textBlock = (data.content || []).find(b => b.type === 'text');
    if(!textBlock){ throw new Error('No text content returned.'); }

    let clean = textBlock.text.trim().replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
    const parsed = JSON.parse(clean);

    renderReport(brand, parsed);
    status.textContent = 'Audit complete.';
  }catch(err){
    console.error(err);
    errorBox.textContent = 'Something went wrong running the audit: ' + err.message + '. Try again in a moment.';
    status.textContent = '';
  }finally{
    btn.disabled = false;
  }
}

function verdictClass(v){
  v = (v||'').toUpperCase();
  if(v === 'STRONG') return 'strong';
  if(v === 'WEAK') return 'weak';
  return 'mixed';
}

function escapeHtml(str){
  const d = document.createElement('div');
  d.textContent = str || '';
  return d.innerHTML;
}

function renderReport(brand, data){
  const report = document.getElementById('report');
  const today = new Date().toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' });

  let cardsHtml = '';
  (data.categories || []).forEach(cat => {
    cardsHtml += `
      <div class="card">
        <div class="stamp ${verdictClass(cat.verdict)}">${escapeHtml(cat.verdict)}</div>
        <div class="card-title">${escapeHtml(cat.title)}</div>
        <p class="diagnosis">${escapeHtml(cat.diagnosis)}</p>
        <p class="analysis">${escapeHtml(cat.analysis)}</p>
      </div>`;
  });

  report.innerHTML = `
    <div class="report-head">
      <h2>${escapeHtml(brand)}</h2>
      <span class="date">${today}</span>
    </div>
    <p class="overall-read">${escapeHtml(data.overallRead)}</p>
    ${cardsHtml}
    <div class="bottom-line">
      <p>${escapeHtml(data.bottomLine)}</p>
      <div class="signoff">— Positioning Audit, Field Instrument 01</div>
    </div>
    <div class="copy-row">
      <button class="copy" id="copyBtn">Copy as Memo</button>
    </div>
  `;

  document.getElementById('copyBtn').addEventListener('click', () => {
    let memo = `POSITIONING AUDIT — ${brand}\n${today}\n\nOVERALL READ: ${data.overallRead}\n\n`;
    (data.categories || []).forEach(cat => {
      memo += `${cat.title.toUpperCase()} — ${cat.verdict}\n${cat.diagnosis}\n${cat.analysis}\n\n`;
    });
    memo += `BOTTOM LINE\n${data.bottomLine}\n`;

    navigator.clipboard.writeText(memo).then(() => {
      const btn = document.getElementById('copyBtn');
      const original = btn.textContent;
      btn.textContent = 'Copied';
      setTimeout(() => { btn.textContent = original; }, 1800);
    });
  });
}
</script>
</body>
</html>
